services:
  edge-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: edge-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      # ─── Deployment mode ───────────────────────────────────────────
      # middleware (default): one-way egress to an external vendor fraud
      #   platform. Requires the vendor params below.
      # standalone: no external system; signals go to the local sink
      #   instead. If you run standalone, none of the vendor params below
      #   are read, but compose still requires them to be *set* (even to
      #   an empty string, e.g. `API_KEY=` in your .env) because "not set
      #   at all" is treated the same as a forgotten credential. That's a
      #   compose-level limitation, not an app one: the app itself never
      #   demands vendor credentials in standalone mode (see main.go's
      #   validateStartup).
      - GATEWAY_MODE=${GATEWAY_MODE:-middleware}

      # ─── Vendor platform params (required in middleware mode) ──────
      # All four use ${VAR:?...}, which fails `docker compose up` with a
      # clear one-line error *before* any container starts, instead of
      # starting the container and letting it crash-loop under
      # `restart: always`. This must stay consistent across all four -
      # a required var using ${VAR:-default-or-empty} silently defeats
      # that fail-fast behavior for exactly this reason.
      - INSTITUTION_ID=${INSTITUTION_ID:?Set INSTITUTION_ID}
      - API_KEY=${API_KEY:?Set API_KEY (required in middleware mode)}
      - HMAC_SECRET=${HMAC_SECRET:?Set HMAC_SECRET (required in middleware mode)}
      - HUB_API_URL=${HUB_API_URL:?Set HUB_API_URL (required in middleware mode; no placeholder default is used)}

      # ─── Local params (managed by the bank, never sent externally) ─
      - BANK_SALT=${BANK_SALT:?Set BANK_SALT (min 32 chars)}
      - REGIONAL_PEPPER=${REGIONAL_PEPPER:?Set REGIONAL_PEPPER (required in middleware mode; not needed if GATEWAY_MODE=standalone)}

      # ─── Standalone mode only (ignored in middleware mode) ─────────
      - STANDALONE_SINK_DIR=${STANDALONE_SINK_DIR:-/sink}

      # ─── Optional ────────────────────────────────────────────────
      - GATEWAY_PORT=8080
      - REPORTING_THRESHOLD=${REPORTING_THRESHOLD:-10000}
      - INBOUND_API_KEY=${INBOUND_API_KEY:-}
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
      # Durable queue: signals survive destination outages and gateway restarts
      - SPOOL_DIR=${SPOOL_DIR:-/spool}
      - SPOOL_MAX_DEPTH=${SPOOL_MAX_DEPTH:-10000}
    volumes:
      - ./config:/config:ro
      - spool-data:/spool
      - sink-data:/sink
    healthcheck:
      # Distroless image has no shell/wget — the binary probes itself.
      test: ["CMD", "/edge-gateway", "-healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  spool-data:
  sink-data:
