services:
  edge-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: edge-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      # ─── Deployment mode ───────────────────────────────────────────
      # middleware (default): one-way egress to an external vendor fraud
      #   platform. Requires the vendor params below.
      # standalone: no external system; signals go to the local sink
      #   instead. None of the vendor params below are read in this mode.
      #   To run standalone with this file, set GATEWAY_MODE=standalone
      #   AND set each vendor var below to an explicit empty value in your
      #   .env, e.g. `API_KEY=` (present, but blank) - NOT simply omitted.
      #   This matters because of how `${VAR?...}` (below) differs from
      #   `${VAR:?...}`: verified against `docker compose config` output,
      #   the colon form (:?) errors on both "unset" and "set but empty",
      #   while the no-colon form (?) errors only on "unset" and happily
      #   passes an explicit empty string through. Using the no-colon form
      #   for the vendor vars is what makes standalone actually work from
      #   this same file: forgetting a var still fails `docker compose up`
      #   with a clear error before any container starts (avoiding a
      #   crash-loop under `restart: always`), while deliberately blanking
      #   a var for standalone is respected. The app itself never demands
      #   vendor credentials in standalone mode either way (see main.go's
      #   validateStartup) - this is purely about compose getting out of
      #   its way.
      - GATEWAY_MODE=${GATEWAY_MODE:-middleware}

      # ─── Mosaic keying (independent of GATEWAY_MODE) ────────────────
      # bank (default): every mosaic folds in BANK_SALT; MOSAIC_PEPPER
      #   below is optional. regional: national-ID mosaics are keyed on
      #   MOSAIC_PEPPER alone - REQUIRED in that mode. See .env.example
      #   and README's Configuration section for the full tradeoff.
      - MOSAIC_KEYING=${MOSAIC_KEYING:-bank}

      # ─── Vendor platform params (required in middleware mode only) ─
      # All three use ${VAR?...} (no colon - see comment above): fails
      # `docker compose up` with a clear one-line error if forgotten
      # entirely, but allows an explicit empty value for standalone mode.
      - API_KEY=${API_KEY?Set API_KEY (required in middleware mode; set to an explicit empty value for standalone, e.g. API_KEY= in .env)}
      - HMAC_SECRET=${HMAC_SECRET?Set HMAC_SECRET (required in middleware mode; set to an explicit empty value for standalone, e.g. HMAC_SECRET= in .env)}
      - HUB_API_URL=${HUB_API_URL?Set HUB_API_URL (required in middleware mode, no placeholder default is used; set to an explicit empty value for standalone, e.g. HUB_API_URL= in .env)}

      # ─── Local params (managed by the bank, never sent externally) ─
      # INSTITUTION_ID/BANK_SALT are required in BOTH modes, so they keep
      # ${VAR:?...} - an empty value is never acceptable for them.
      #
      # MOSAIC_PEPPER/REGIONAL_PEPPER: the application (pepperEnv() in
      # cmd/gateway/main.go) reads MOSAIC_PEPPER first and falls back to
      # REGIONAL_PEPPER as a backward-compatible alias, so BOTH names must
      # actually reach the container for that fallback to do anything -
      # forwarding only one of them silently drops whichever one an
      # existing deployment's .env happens to set. Passed through plainly
      # with ${VAR:-} (no requiredness at the compose level): whether a
      # pepper is required at all depends on MOSAIC_KEYING (required when
      # =regional, optional when =bank, the default), which this compose
      # file can't express with ${VAR?...}/${VAR:?...} - that condition is
      # enforced at the application level instead (main.validateStartup
      # fails startup fast when MOSAIC_KEYING=regional and neither is set).
      # If both are set, MOSAIC_PEPPER wins, matching pepperEnv().
      - INSTITUTION_ID=${INSTITUTION_ID:?Set INSTITUTION_ID}
      - BANK_SALT=${BANK_SALT:?Set BANK_SALT (min 32 chars)}
      - MOSAIC_PEPPER=${MOSAIC_PEPPER:-}
      - REGIONAL_PEPPER=${REGIONAL_PEPPER:-}

      # ─── Standalone mode only (ignored in middleware mode) ─────────
      - STANDALONE_SINK_DIR=${STANDALONE_SINK_DIR:-/sink}

      # ─── Optional ────────────────────────────────────────────────
      - GATEWAY_PORT=8080
      - REPORTING_THRESHOLD=${REPORTING_THRESHOLD:-10000}
      - INBOUND_API_KEY=${INBOUND_API_KEY:-}
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
      # Durable queue: signals survive destination outages and gateway restarts
      - SPOOL_DIR=${SPOOL_DIR:-/spool}
      - SPOOL_MAX_DEPTH=${SPOOL_MAX_DEPTH:-10000}
      # Readiness thresholds for /readyz (spool backlog/staleness). This is
      # NOT the liveness endpoint the healthcheck below calls - /readyz must
      # never be wired to an auto-restart action; see README's API Endpoints
      # section.
      - READINESS_MAX_DEPTH_RATIO=${READINESS_MAX_DEPTH_RATIO:-0.95}
      - READINESS_MAX_STALENESS_SECONDS=${READINESS_MAX_STALENESS_SECONDS:-900}
    volumes:
      - ./config:/config:ro
      - spool-data:/spool
      - sink-data:/sink
    healthcheck:
      # Distroless image has no shell/wget — the binary probes itself.
      test: ["CMD", "/edge-gateway", "-healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  spool-data:
  sink-data:
